name: Android Version Check

on:
  push:
    branches:
      - CICD  
  release:
    types: [published]

jobs:
  check-version:
    name: Check Version Code and Name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Print existing version from build.gradle.kts
        run: |
          grep "versionCode" app/build.gradle.kts
          grep "versionName" app/build.gradle.kts

      - name: Check and save version report
        if: github.event_name == 'release'
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          VERSION_NAME=${TAG_NAME#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          CURRENT_CODE=$(grep "versionCode" app/build.gradle.kts | awk '{print $2}')
          CURRENT_NAME=$(grep "versionName" app/build.gradle.kts | cut -d '"' -f2)

          echo "Current versionCode: $CURRENT_CODE" > version_check.txt
          echo "Current versionName: $CURRENT_NAME" >> version_check.txt
          echo "New versionCode: $VERSION_CODE" >> version_check.txt
          echo "New versionName: $VERSION_NAME" >> version_check.txt

          if [ "$VERSION_CODE" -le "$CURRENT_CODE" ]; then
            echo "❌ ERROR: versionCode not incremented" >> version_check.txt
            exit 1
          fi

          if [ "$VERSION_NAME" == "$CURRENT_NAME" ]; then
            echo "❌ ERROR: versionName not changed" >> version_check.txt
            exit 1
          fi

          echo "✅ SUCCESS: versionCode and versionName are updated correctly" >> version_check.txt

      - name: Upload version check report
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: version-check-report
          path: version_check.txt
